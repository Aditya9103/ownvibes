name: Deploy OwnVibes Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Starting OwnVibes deployment..."

            cd /opt/apps/ownvibes

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Docker image..."
            cd backend
            sudo docker build -t ownvibes-api:latest .

            echo "Stopping old container..."
            sudo docker stop ownvibes-api || true

            echo "Removing old container..."
            sudo docker rm ownvibes-api || true

            echo "Starting new container..."
            sudo docker run -d \
              --name ownvibes-api \
              --env-file /opt/apps/ownvibes/env/production.env \
              -p 127.0.0.1:3003:3001 \
              --restart always \
              ownvibes-api:latest

            echo "Waiting for container..."
            sleep 10

            echo "Checking container..."
            sudo docker ps --filter "name=ownvibes-api"

            echo "Checking application..."
            curl --fail http://127.0.0.1:3003/ || exit 1

            echo "Deployment successful!"
