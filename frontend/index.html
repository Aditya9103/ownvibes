<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ownvibes" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#cf7e28" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

  <!-- Resource Hints for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

  <!-- Fundamental SEO -->
  <title>Ownvibes | Premium T-shirts & Apparel Store</title>
  <meta name="description"
    content="Shop the best premium t-shirts and apparel at Ownvibes. Discover new arrivals, best sellers, and exclusive combo offers. Buy online now!" />
  <meta name="keywords"
    content="Ownvibes, premium t-shirts, apparel online, luxury tees, buy t-shirts, best t-shirts India, high-quality apparel, e-commerce clothing store, graphic tees, oversized t-shirts, fashion, trendy clothing" />
  <meta name="author" content="Ownvibes" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.ownvibes.in/" />
  <meta property="og:title" content="Ownvibes | Premium T-shirts & Apparel" />
  <meta property="og:description"
    content="Find the best t-shirts and premium apparel at Ownvibes. Perfect additions to your wardrobe. Shop our exclusive collection today!" />
  <meta property="og:image" content="https://www.ownvibes.in/logo.jpeg" />
  <meta property="og:site_name" content="Ownvibes" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.ownvibes.in/" />
  <meta name="twitter:title" content="Ownvibes | Premium T-shirts & Apparel" />
  <meta name="twitter:description"
    content="Discover the best t-shirts and apparel. Shop now at Ownvibes!" />
  <meta name="twitter:image" content="https://www.ownvibes.in/logo.jpeg" />

  <!-- SEO Structured Data for Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ownvibes",
      "url": "https://www.ownvibes.in/",
      "logo": "https://www.ownvibes.in/logo.jpeg",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91 8873405595",
          "contactType": "customer service",
          "email": "info@ownvibes.com",
          "areaServed": "IN",
          "availableLanguage": "en"
        }
      ],
      "sameAs": [
        "https://www.facebook.com/ownvibes",
        "https://www.instagram.com/ownvibes",
        "https://twitter.com/ownvibes"
      ],
      "address": [
        {
          "@type": "PostalAddress",
          "streetAddress": "C-31, Nawada Housing Complex",
          "addressLocality": "New Delhi",
          "postalCode": "110059",
          "addressCountry": "IN"
        }
      ]
    }
  </script>
  <!-- Apple Touch Startup Images (PWA Splash Screen on iOS) -->
  <link rel="apple-touch-startup-image" href="/screens/home-narrow.png" media="(orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="/screens/home-wide.png" media="(orientation: landscape)" />
  <link rel="preload" as="image" href="/screens/home-narrow.png" />
</head>

<body>
  <div id="root">
    <!-- Instant PWA Launch Screen (replaces blank white screen before JS renders) -->
    <div id="pwa-launch-screen" style="position:fixed;inset:0;background:#0d0d0e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;overflow:hidden;">
      <picture style="position:absolute;inset:0;width:100%;height:100%;">
        <source media="(min-width: 768px)" srcset="/screens/home-wide.png" />
        <img src="/screens/home-narrow.png" alt="Ownvibes App" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
      </picture>
      <div style="position:absolute;bottom:36px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10;padding:0 24px;">
        <div style="width:120px;height:3px;background:rgba(255,255,255,0.18);border-radius:99px;overflow:hidden;backdrop-filter:blur(4px);">
          <div style="width:45%;height:100%;background:linear-gradient(90deg,#b58145,#f59e0b);border-radius:99px;animation:pwa-pulse 1.1s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes pwa-pulse {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(250%); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
